# ABOUTME: GitLab CI build stage jobs for Docker image building
# ABOUTME: Builds Docker images for development, staging, and production environments

# =============================================================================
# BUILD STAGE - Docker Image Builds
# =============================================================================
#
# Image Tagging Strategy:
#   develop branch  → dev-$CI_COMMIT_SHORT_SHA, dev-latest
#   staging branch  → staging-$CI_COMMIT_SHORT_SHA, staging-latest
#   main branch     → prod-$CI_COMMIT_SHORT_SHA, prod-latest
#   Git tags (v*.*.*)  → $CI_COMMIT_TAG, latest (multi-platform)
#
# =============================================================================

# =============================================================================
# Build Development Images (develop branch)
# =============================================================================

build-dev:
  stage: build
  tags:
    - shell
  timeout: 45m
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    IMAGE_TAG: dev-latest
  before_script:
    - echo "Using host Docker daemon..."
    - docker --version
    - echo "Authenticating with GitLab Container Registry..."
    - |
      if [ -z "${CI_REGISTRY_USER}" ] || [ -z "${CI_REGISTRY_PASSWORD}" ]; then
        echo "Error: CI_REGISTRY_USER and CI_REGISTRY_PASSWORD must be set"
        exit 1
      fi
    - echo "${CI_REGISTRY_PASSWORD}" | docker login --username "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
    - echo "Git information:"
    - git --version
    - git log --oneline -5 || echo "No git log available"
    - git describe --tags --long --dirty || echo "No git describe available"
  script:
    - echo "Building development container image..."
    - echo "Branch - $CI_COMMIT_BRANCH"
    - echo "Commit SHA - $CI_COMMIT_SHORT_SHA"
    - echo "Image tags - dev-$CI_COMMIT_SHORT_SHA, dev-latest"
    - |
      # Set version for setuptools_scm
      export SETUPTOOLS_SCM_PRETEND_VERSION="0.1.0.dev0+g$CI_COMMIT_SHORT_SHA"
      echo "Using dev version: $SETUPTOOLS_SCM_PRETEND_VERSION"
    - |
      # Build development image
      if ! DOCKER_BUILDKIT=1 docker build \
        --target=production \
        --tag "$CI_REGISTRY_IMAGE:dev-$CI_COMMIT_SHORT_SHA" \
        --tag "$CI_REGISTRY_IMAGE:dev-latest" \
        --label "org.opencontainers.image.source=https://github.com/trakbridge/trakbridge" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --label "org.opencontainers.image.version=$CI_COMMIT_REF_NAME" \
        --label "org.opencontainers.image.title=trakbridge" \
        --build-arg SETUPTOOLS_SCM_PRETEND_VERSION="$SETUPTOOLS_SCM_PRETEND_VERSION" \
        --file Dockerfile \
        . ; then
        echo "Docker build failed"
        exit 1
      fi
    - echo "Pushing development images to GitLab Container Registry..."
    - docker push "$CI_REGISTRY_IMAGE:dev-$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:dev-latest"
    - echo "Development build completed"
    - echo "   - $CI_REGISTRY_IMAGE:dev-$CI_COMMIT_SHORT_SHA"
    - echo "   - $CI_REGISTRY_IMAGE:dev-latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

