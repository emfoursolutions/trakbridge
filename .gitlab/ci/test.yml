    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

# Integration tests - MySQL/MariaDB (comprehensive database compatibility)
integration-tests-mysql:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  <<: *mysql_service
  tags:
    - trakbridge-ci
  timeout: 15m

  variables:
    FLASK_ENV: "testing"
    SECRET_KEY: "test-secret-key-for-gitlab-ci"
    TRAKBRIDGE_ENCRYPTION_KEY: "test-encryption-key-for-gitlab-ci-12345"
    # Force MySQL/MariaDB usage even in testing environment
    DB_TYPE: "mysql"
    DB_HOST: "mariadb"
    DB_PORT: "3306"
    DB_USER: "test_user"
    DB_PASSWORD: "test_password"
    DB_NAME: "test_db"
    # Ensure Python can find the project modules
    PYTHONPATH: "${CI_PROJECT_DIR}:${PYTHONPATH:-}"

  before_script:
    - *install_packages
    - install_packages git curl build-essential
    - pip install --upgrade pip
    - pip install -e ".[dev]"

  script: |
    echo "Running integration tests against MySQL/MariaDB..."

    # Wait for MariaDB service to be ready
    echo "Waiting for MariaDB to be ready..."
    for i in {1..30}; do
      if python -c "import pymysql; pymysql.connect(host='mariadb', user='test_user', password='test_password', database='test_db')" 2>/dev/null; then
        echo "MariaDB is ready!"
        break
      fi
      echo "Waiting for MariaDB... ($i/30)"
      sleep 2
    done

    # Verify database environment variables
    echo "Database configuration:"
    echo "DB_TYPE: $DB_TYPE"
    echo "DATABASE_URL: $DATABASE_URL"
    echo "FLASK_ENV: $FLASK_ENV"

    # Run integration tests with MySQL backend, excluding database compatibility tests
    pytest tests/integration/ -v --tb=short --maxfail=5 --durations=10 --junitxml=integration-mysql-results.xml --ignore=tests/integration/test_database_compatibility.py

    echo "MySQL integration tests completed"

  artifacts:
    reports:
      junit: integration-mysql-results.xml
    paths:
      - integration-mysql-results.xml
      - tests/integration/
    expire_in: 14 days

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

# Database compatibility tests - No database environment variables set
# This job tests dynamic database configuration switching within the same test run
database-compatibility-tests:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  tags:
    - trakbridge-ci
  timeout: 15m

  variables:
    FLASK_ENV: "testing"
    SECRET_KEY: "test-secret-key-for-gitlab-ci"
    TRAKBRIDGE_ENCRYPTION_KEY: "test-encryption-key-for-gitlab-ci-12345"
    # Ensure Python can find the project modules
    PYTHONPATH: "${CI_PROJECT_DIR}:${PYTHONPATH:-}"
    # Critical: No DB_TYPE or DATABASE_URL set - tests control database configuration

  before_script:
    - *install_packages
    - install_packages git curl build-essential
    - pip install --upgrade pip
    - pip install -e ".[dev]"

  script: |
    echo "Running database compatibility tests..."
    echo "These tests verify database configuration precedence and dynamic switching"

    # Run only the database compatibility tests with no database environment constraints
    pytest tests/integration/test_database_compatibility.py -v --tb=short --maxfail=5 --durations=10 --junitxml=database-compatibility-results.xml

    echo "Database compatibility tests completed"

  artifacts:
    reports:
      junit: database-compatibility-results.xml
    paths:
      - database-compatibility-results.xml
      - tests/integration/test_database_compatibility.py
    expire_in: 14 days

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
