# ABOUTME: GitLab CI release stage jobs for GHCR (primary) and DockerHub (backup) publication
# ABOUTME: Copies multi-arch manifests from GitLab Container Registry without rebuilding

# =============================================================================
# RELEASE STAGE - Public Registry Publication
# =============================================================================
#
# Purpose:
#   Publish production-ready images to public registries for distribution.
#   GHCR is the primary registry; DockerHub is a backup mirror.
#
# Workflow:
#   Both jobs use `docker buildx imagetools create` to copy the multi-arch
#   manifest from the GitLab Container Registry directly to the target
#   registry. This preserves all platform variants (linux/amd64, linux/arm64)
#   without pulling or rebuilding.
#
# Triggers:
#   - Git tags (v*.*.*) - Manual approval required
#   - Main branch      - Manual approval required (uses prod-latest)
#
# Prerequisites:
#   - build-prod must succeed first (produces the multi-arch source image)
#   - GHCR_USERNAME and GHCR_TOKEN configured in GitLab variables
#     (PAT with write:packages scope on github.com/trakbridge)
#   - DOCKERHUB_USERNAME and DOCKERHUB_TOKEN configured in GitLab variables
#
# =============================================================================

.release-common:
  stage: release
  tags:
    - shell
  timeout: 30m
  needs:
    - build-prod
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

release-ghcr:
  extends: .release-common
  variables:
    GHCR_IMAGE: ghcr.io/trakbridge/trakbridge
  resource_group: ghcr-release
  before_script:
    - echo "Authenticating with container registries..."
    - |
      if [ -z "${GHCR_USERNAME}" ] || [ -z "${GHCR_TOKEN}" ]; then
        echo "Error: GHCR_USERNAME and GHCR_TOKEN must be set"
        exit 1
      fi
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - echo "$GHCR_TOKEN" | docker login -u "$GHCR_USERNAME" --password-stdin ghcr.io
    - docker buildx version
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export SOURCE_TAG="$CI_COMMIT_TAG"
        export PUBLISH_VERSION="$CI_COMMIT_TAG"
      else
        export SOURCE_TAG="prod-latest"
        export PUBLISH_VERSION="main-$(date +%Y%m%d-%H%M%S)"
      fi

      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "GHCR Release Configuration"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "  Source: $CI_REGISTRY_IMAGE:$SOURCE_TAG"
      echo "  Target: $GHCR_IMAGE:$PUBLISH_VERSION (and :latest)"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # Copy multi-arch manifest directly between registries.
      # imagetools create preserves all platform variants without pulling.
      if ! docker buildx imagetools create \
        --tag "$GHCR_IMAGE:$PUBLISH_VERSION" \
        --tag "$GHCR_IMAGE:latest" \
        "$CI_REGISTRY_IMAGE:$SOURCE_TAG"; then
        echo "Failed to copy image to GHCR"
        exit 1
      fi

      echo ""
      echo "Verifying published manifest..."
      docker buildx imagetools inspect "$GHCR_IMAGE:$PUBLISH_VERSION"

      echo ""
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "GHCR Publication Successful"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "  docker pull $GHCR_IMAGE:$PUBLISH_VERSION"
      echo "  docker pull $GHCR_IMAGE:latest"

release-dockerhub:
  extends: .release-common
  variables:
    DOCKERHUB_IMAGE: emfoursolutions/trakbridge
  resource_group: dockerhub-release
  before_script:
    - echo "Authenticating with container registries..."
    - |
      if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
        echo "Error: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be set"
        exit 1
      fi
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin docker.io
    - docker buildx version
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export SOURCE_TAG="$CI_COMMIT_TAG"
        export PUBLISH_VERSION="$CI_COMMIT_TAG"
      else
        export SOURCE_TAG="prod-latest"
        export PUBLISH_VERSION="main-$(date +%Y%m%d-%H%M%S)"
      fi

      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "DockerHub Release Configuration (backup mirror)"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "  Source: $CI_REGISTRY_IMAGE:$SOURCE_TAG"
      echo "  Target: $DOCKERHUB_IMAGE:$PUBLISH_VERSION (and :latest)"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      if ! docker buildx imagetools create \
        --tag "$DOCKERHUB_IMAGE:$PUBLISH_VERSION" \
        --tag "$DOCKERHUB_IMAGE:latest" \
        "$CI_REGISTRY_IMAGE:$SOURCE_TAG"; then
        echo "Failed to copy image to DockerHub"
        exit 1
      fi

      echo ""
      echo "Verifying published manifest..."
      docker buildx imagetools inspect "$DOCKERHUB_IMAGE:$PUBLISH_VERSION"

      echo ""
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "DockerHub Publication Successful"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "  docker pull $DOCKERHUB_IMAGE:$PUBLISH_VERSION"
      echo "  docker pull $DOCKERHUB_IMAGE:latest"
