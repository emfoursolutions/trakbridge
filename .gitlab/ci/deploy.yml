# ABOUTME: GitLab CI deployment stage jobs for SSH-based deployments
# ABOUTME: Deploys TrakBridge to dev, staging, and production environments with multi-database support

# =============================================================================
# DEPLOY STAGE - SSH-Based Deployments
# =============================================================================
#
# Deployment Environments:
#   Development (PostgreSQL) → tb-dev.emfour.net (auto)
#   Development (MySQL)      → tb-dev-mysql.emfour.net (manual)
#   Development (SQLite)     → tb-dev-sqlite.emfour.net (manual)
#   Staging                  → tb-staging.emfour.net (auto)
#   Production               → tb.emfour.net (manual)
#
# All deployments:
#   - Use SSH for remote access
#   - Deploy via docker-compose
#   - Route through Traefik reverse proxy
#   - Validate with health checks
#
# =============================================================================

# =============================================================================
# Base Deployment Template
# =============================================================================

.deploy-base:
  image: alpine:latest
  tags:
    - docker
  before_script:
    - echo "Setting up deployment environment..."
    - apk add --no-cache openssh-client docker-cli docker-compose curl
    - echo "Configuring SSH agent..."
    - eval $(ssh-agent -s)
    - printf '%s' "$DEPLOY_SSH_KEY" | base64 -d > /tmp/deploy_key
    - chmod 600 /tmp/deploy_key
    - ssh-add /tmp/deploy_key
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "Adding deployment host to known_hosts..."
    - ssh-keyscan $DEPLOY_HOST >> ~/.ssh/known_hosts
    - echo "✅ Deployment environment ready"

# =============================================================================
# Development Environment Deployments
# =============================================================================

# -----------------------------------------------------------------------------
# PostgreSQL Development (Primary - Auto Deploy)
# -----------------------------------------------------------------------------

deploy-dev-postgres:
  extends: .deploy-base
  stage: deploy-dev
  variables:
    DEPLOY_PATH: /opt/dev/tb-dev
    IMAGE_TAG: dev-latest
    DB_PROFILE: postgres
    DOMAIN: tb-dev.emfour.net
  script:
    - echo "🚀 Deploying to development environment (PostgreSQL)..."
    - echo "Environment - tb-dev.emfour.net"
    - echo "Image - $CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - echo "Database - PostgreSQL"
    - |
      # Create deployment directory structure
      echo "Creating deployment directories..."
      ssh $DEPLOY_USER@$DEPLOY_HOST "mkdir -p $DEPLOY_PATH/{logs,data,secrets,backups,config}"

      # Copy docker-compose file
      echo "Copying docker-compose configuration..."
      scp docker-compose-dev.yml $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml

      # Deploy application
      echo "Deploying application..."
      ssh $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_PATH && \
        echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin $CI_REGISTRY && \
        docker pull $CI_REGISTRY_IMAGE:$IMAGE_TAG && \
        docker-compose -f docker-compose.yml --profile $DB_PROFILE down && \
        docker-compose -f docker-compose.yml --profile $DB_PROFILE up -d"

      # Health check via Traefik domain
      echo "Waiting for application to start..."
      sleep 30
      echo "Running health check..."
      curl -f --retry 5 --retry-delay 10 https://$DOMAIN/api/health

      echo "✅ Development (PostgreSQL) deployment completed successfully"
      echo "🌐 Application available at - https://$DOMAIN"
  environment:
    name: development-postgres
    url: https://tb-dev.emfour.net
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  needs:
    - build-dev

# -----------------------------------------------------------------------------
# MySQL Development (Migration Testing - Manual)
# -----------------------------------------------------------------------------

deploy-dev-mysql:
  extends: .deploy-base
  stage: deploy-dev
  variables:
    DEPLOY_PATH: /opt/dev/tb-dev-mysql
    IMAGE_TAG: dev-latest
    DB_PROFILE: mysql
    DOMAIN: tb-dev-mysql.emfour.net
  script:
    - echo "🚀 Deploying to development environment (MySQL)..."
    - echo "Environment - tb-dev-mysql.emfour.net"
    - echo "Image - $CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - echo "Database - MySQL/MariaDB"
    - echo "⚠️  This is a manual deployment for migration testing"
    - |
      # Create deployment directory structure
      echo "Creating deployment directories..."
      ssh $DEPLOY_USER@$DEPLOY_HOST "mkdir -p $DEPLOY_PATH/{logs,data,secrets,backups,config}"

      # Copy docker-compose file
      echo "Copying docker-compose configuration..."
      scp docker-compose-dev.yml $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml

      # Deploy application
      echo "Deploying application..."
      ssh $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_PATH && \
        echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin $CI_REGISTRY && \
        docker pull $CI_REGISTRY_IMAGE:$IMAGE_TAG && \
        docker-compose -f docker-compose.yml --profile $DB_PROFILE down && \
        docker-compose -f docker-compose.yml --profile $DB_PROFILE up -d"

      # Health check via Traefik domain
      echo "Waiting for application to start..."
      sleep 30
      echo "Running health check..."
      curl -f --retry 5 --retry-delay 10 https://$DOMAIN/api/health

      echo "✅ Development (MySQL) deployment completed successfully"
      echo "🌐 Application available at - https://$DOMAIN"
      echo "💡 Remember to test database migrations"
      echo "💡 Use 'stop-dev-mysql' job to clean up when done"
  environment:
    name: development-mysql
    url: https://tb-dev-mysql.emfour.net
    on_stop: stop-dev-mysql
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
      allow_failure: true
  needs:
    - build-dev

# -----------------------------------------------------------------------------
# SQLite Development (Migration Testing - Manual)
# -----------------------------------------------------------------------------

deploy-dev-sqlite:
  extends: .deploy-base
  stage: deploy-dev
  variables:
    DEPLOY_PATH: /opt/dev/tb-dev-sqlite
    IMAGE_TAG: dev-latest
    DOMAIN: tb-dev-sqlite.emfour.net
  script:
    - echo "🚀 Deploying to development environment (SQLite)..."
    - echo "Environment - tb-dev-sqlite.emfour.net"
    - echo "Image - $CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - echo "Database - SQLite (file-based)"
    - echo "⚠️  This is a manual deployment for migration testing"
    - |
      # Create deployment directory structure
      echo "Creating deployment directories..."
      ssh $DEPLOY_USER@$DEPLOY_HOST "mkdir -p $DEPLOY_PATH/{logs,data,secrets,backups,config}"

      # Copy docker-compose file
      echo "Copying docker-compose configuration..."
      scp docker-compose-dev.yml $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml

      # Deploy application with SQLite (no database profile)
      echo "Deploying application..."
      ssh $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_PATH && \
        echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin $CI_REGISTRY && \
        docker pull $CI_REGISTRY_IMAGE:$IMAGE_TAG && \
        export DB_TYPE=sqlite && \
        docker-compose -f docker-compose.yml down && \
        docker-compose -f docker-compose.yml up -d app"

      # Health check via Traefik domain
      echo "Waiting for application to start..."
      sleep 30
      echo "Running health check..."
      curl -f --retry 5 --retry-delay 10 https://$DOMAIN/api/health

      echo "✅ Development (SQLite) deployment completed successfully"
      echo "🌐 Application available at - https://$DOMAIN"
      echo "💡 Remember to test database migrations"
      echo "💡 Use 'stop-dev-sqlite' job to clean up when done"
  environment:
    name: development-sqlite
    url: https://tb-dev-sqlite.emfour.net
    on_stop: stop-dev-sqlite
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
      allow_failure: true
  needs:
    - build-dev

# -----------------------------------------------------------------------------
# Development Environment Cleanup Jobs
# -----------------------------------------------------------------------------

stop-dev-mysql:
  extends: .deploy-base
  stage: deploy-dev
  variables:
    DEPLOY_PATH: /opt/dev/tb-dev-mysql
  script:
    - echo "🧹 Stopping MySQL development environment..."
    - ssh $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_PATH && docker-compose --profile mysql down -v"
    - echo "✅ MySQL development environment stopped and volumes removed"
  environment:
    name: development-mysql
    action: stop
  when: manual

stop-dev-sqlite:
  extends: .deploy-base
  stage: deploy-dev
  variables:
    DEPLOY_PATH: /opt/dev/tb-dev-sqlite
  script:
    - echo "🧹 Stopping SQLite development environment..."
    - ssh $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_PATH && docker-compose down -v"
    - echo "✅ SQLite development environment stopped and volumes removed"
  environment:
    name: development-sqlite
    action: stop
  when: manual

# =============================================================================
# Staging Environment Deployment
# =============================================================================

deploy-staging:
  extends: .deploy-base
  stage: deploy-staging
  variables:
    DEPLOY_PATH: /opt/dev/tb-staging
    IMAGE_TAG: staging-latest
    DB_PROFILE: postgres
    DOMAIN: tb-staging.emfour.net
  script:
    - echo "🚀 Deploying to staging environment..."
    - echo "Environment - tb-staging.emfour.net"
    - echo "Image - $CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - echo "Database - PostgreSQL"
    - |
      # Create deployment directory structure
      echo "Creating deployment directories..."
      ssh $DEPLOY_USER@$DEPLOY_HOST "mkdir -p $DEPLOY_PATH/{logs,data,secrets,backups,config}"

      # Copy docker-compose file
      echo "Copying docker-compose configuration..."
      scp docker-compose.staging.yml $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml

      # Deploy application
      echo "Deploying application..."
      ssh $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_PATH && \
        echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin $CI_REGISTRY && \
        docker pull $CI_REGISTRY_IMAGE:$IMAGE_TAG && \
        docker-compose -f docker-compose.yml --profile $DB_PROFILE down && \
        docker-compose -f docker-compose.yml --profile $DB_PROFILE up -d"

      # Health check via Traefik domain
      echo "Waiting for application to start..."
      sleep 30
      echo "Running health check..."
      curl -f --retry 5 --retry-delay 10 https://$DOMAIN/api/health

      echo "✅ Staging deployment completed successfully"
      echo "🌐 Application available at - https://$DOMAIN"
      echo "📋 Ready for UAT and final validation"
  environment:
    name: staging
    url: https://tb-staging.emfour.net
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  needs:
    - build-staging

# =============================================================================
# Production Environment Deployment
# =============================================================================

deploy-prod:
  extends: .deploy-base
  stage: deploy-prod
  variables:
    DEPLOY_PATH: /opt/prod/trakbridge
    DB_PROFILE: postgres
    DOMAIN: tb.emfour.net
  script:
    - echo "🚀 Deploying to PRODUCTION environment..."
    - echo "⚠️  PRODUCTION DEPLOYMENT - Manual approval required"
    - echo "Environment - tb.emfour.net"
    - echo "Database - PostgreSQL"
    - |
      # Determine image tag based on commit type
      if [ -n "$CI_COMMIT_TAG" ]; then
        export IMAGE_TAG="$CI_COMMIT_TAG"
        echo "Image - $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG (tagged release)"
      else
        export IMAGE_TAG="prod-latest"
        echo "Image - $CI_REGISTRY_IMAGE:prod-latest (main branch)"
      fi
    - |
      # Create deployment directory structure
      echo "Creating deployment directories..."
      ssh $DEPLOY_USER@$DEPLOY_HOST "mkdir -p $DEPLOY_PATH/{logs,data,secrets,backups,config}"

      # Copy docker-compose file
      echo "Copying docker-compose configuration..."
      scp docker-compose.yml $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml

      # Deploy application
      echo "Deploying application..."
      ssh $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_PATH && \
        echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin $CI_REGISTRY && \
        docker pull $CI_REGISTRY_IMAGE:$IMAGE_TAG && \
        docker-compose -f docker-compose.yml --profile $DB_PROFILE down && \
        docker-compose -f docker-compose.yml --profile $DB_PROFILE up -d"

      # Health check via Traefik domain (strict failure on production)
      echo "Waiting for application to start..."
      sleep 30
      echo "Running health check..."
      if ! curl -f --retry 5 --retry-delay 10 https://$DOMAIN/api/health; then
        echo "❌ Production health check failed!"
        exit 1
      fi

      echo "✅ PRODUCTION deployment completed successfully"
      echo "🌐 Application available at - https://$DOMAIN"
      echo "🎉 Production deployment verified and healthy"
  environment:
    name: production
    url: https://tb.emfour.net
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  needs:
    - build-prod
