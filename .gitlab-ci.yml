# ABOUTME: TrakBridge GitLab CI/CD Pipeline - Modular Configuration
# ABOUTME: Main pipeline file that includes modular CI configuration files

# =============================================================================
# TrakBridge GitLab CI/CD Pipeline - Modular Structure
# =============================================================================
#
# This is the new modular CI/CD pipeline structure for TrakBridge.
# Individual stage configurations are located in .gitlab/ci/ directory.
#
# Structure:
#   .gitlab/ci/validate.yml  - YAML, requirements, pyproject validation
#   .gitlab/ci/test.yml      - Unit tests, integration tests, code quality
#   .gitlab/ci/security.yml  - Security scanning (bandit, safety, licenses)
#   .gitlab/ci/build.yml     - Docker image builds (Phase 4)
#   .gitlab/ci/deploy.yml    - SSH deployments to environments (Phase 5)
#   .gitlab/ci/release.yml   - DockerHub publication (Phase 6)
#
# =============================================================================

include:
  - local: '.gitlab/ci/validate.yml'
  - local: '.gitlab/ci/test.yml'
  - local: '.gitlab/ci/security.yml'
  - local: '.gitlab/ci/build.yml'
  - local: '.gitlab/ci/deploy.yml'
  - local: '.gitlab/ci/release.yml'

stages:
  - validate
  - test
  - security
  - build
  - deploy-dev
  - deploy-staging
  - deploy-prod
  - release

# =============================================================================
# Global Variables
# =============================================================================

variables:
  # Git configuration - CRITICAL for setuptools-scm
  GIT_DEPTH: 0
  GIT_STRATEGY: clone

  # Python configuration
  PYTHON_VERSION: "3.12"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

  # Test configuration
  PYTEST_ADDOPTS: "--strict-markers --strict-config --tb=short"
  COVERAGE_FILE: "$CI_PROJECT_DIR/.coverage"

  # Security scanning
  SAST_EXCLUDED_PATHS: "tests, docs, scripts"
  SECURE_LOG_LEVEL: "info"

# =============================================================================
# Reusable Scripts
# =============================================================================

# Reusable script for cross-platform package installation
.install_packages: &install_packages |
  install_packages() {
    # Detect package manager and install packages
    if command -v apt-get >/dev/null 2>&1; then
      echo "Using apt-get (Debian/Ubuntu)"
      apt-get update -qq && apt-get install -y -qq "$@"
    elif command -v dnf >/dev/null 2>&1; then
      echo "Using dnf (Rocky Linux/Fedora)"
      dnf install -y "$@"
    elif command -v yum >/dev/null 2>&1; then
      echo "Using yum (RHEL/CentOS)"
      yum install -y "$@"
    else
      echo "ERROR: No supported package manager found (apt-get, dnf, yum)"
      exit 1
    fi
  }

# =============================================================================
# Cache Configuration
# =============================================================================

cache:
  - key: "pip-$CI_COMMIT_REF_SLUG-$PYTHON_VERSION"
    paths:
      - .pip-cache/
    policy: pull-push
  - key: "python-venv-$CI_COMMIT_REF_SLUG-$PYTHON_VERSION"
    paths:
      - .venv/
    policy: pull-push
